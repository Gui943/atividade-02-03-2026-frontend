<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="produtos.html">Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contato.html">Contato</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-2">
                        <button id="botaoTema" class="btn btn-outline-secondary btn-sm" type="button">Mudar tema</button>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active position-relative" aria-current="page" href="carrinho.html">
                            <span class="position-relative d-inline-block">
                                <i class="bi-cart me-3 fs-5"></i>
                                <span id="contador-carrinho"
                                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger me">
                                    0
                                </span>
                            </span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <form id="form-contato" class="container mt-5">
        <div class="mb-3">
            <label for="nomeCliente" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nomeCliente" placeholder="Seu Nome" required>
        </div>
        <div class="mb-3">
            <label for="emailCliente" class="form-label">Email</label>
            <input type="email" class="form-control" id="emailCliente" placeholder="nome@gmail.com" required>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="cepCliente" class="form-label">CEP</label>
                <input type="text" class="form-control" id="cepCliente" placeholder="00000-000" maxlength="9" inputmode="numeric" pattern="\d{5}-?\d{3}" title="Digite um CEP válido, apenas números">
            </div>
            <div class="col-md-8 mb-3">
                <label for="ruaCliente" class="form-label">Rua</label>
                <input type="text" class="form-control" id="ruaCliente" placeholder="Rua" >
            </div>
            <div class="col-md-6 mb-3">
                <label for="bairroCliente" class="form-label">Bairro</label>
                <input type="text" class="form-control" id="bairroCliente" placeholder="Bairro">
            </div>
            <div class="col-md-6 mb-3">
                <label for="cidadeCliente" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidadeCliente" placeholder="Cidade">
            </div>
            <div class="col-md-4 mb-3">
                <label for="estadoCliente" class="form-label">Estado</label>
                <input type="text" class="form-control" id="estadoCliente" placeholder="UF" maxlength="2">
            </div>
        </div>
        <div class="mb-3">
            <label for="obsCliente" class="form-label">Obs</label>
            <textarea class="form-control" id="obsCliente" rows="3"></textarea>
        </div>
        <div>
            <button id="btnEnviar" class="btn btn-success" type="submit">Enviar</button>
        </div>
    </form>
    
    <script type="module" src="js/main.js"></script>
</body>
